<svg xmlns="http://www.w3.org/2000/svg" width="900" height="610" viewBox="0 0 900 610" role="img" aria-labelledby="title desc">
<title id="title">Worker procesa dzīves cikls</title><desc id="desc">Starts, gatavība un apstrādes cikls; normāla pabeigšana vai avārija ar darba pārplānošanu; abi ceļi beidzas ar waitpid.</desc>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8z" fill="#526277"/></marker></defs>
<rect width="900" height="610" rx="16" fill="#f4f7fb"/>
<g fill="#fff" stroke="#a8bbd0" stroke-width="2"><rect x="75" y="25" width="360" height="60" rx="10"/><rect x="75" y="125" width="360" height="60" rx="10"/><rect x="75" y="235" width="360" height="75" rx="10"/><rect x="75" y="365" width="360" height="75" rx="10"/><rect x="530" y="235" width="300" height="75" rx="10"/><rect x="530" y="365" width="300" height="75" rx="10"/><rect x="250" y="520" width="420" height="65" rx="10"/></g>
<g fill="none" stroke="#526277" stroke-width="2" marker-end="url(#a)"><path d="M255 85V125"/><path d="M255 185V235"/><path d="M75 273H35V155H75"/><path d="M255 310V365"/><path d="M435 155H680V235"/><path d="M680 310V365"/><path d="M255 440V485H375V520"/><path d="M680 440V485H555V520"/></g>
<g font-family="Arial,sans-serif" font-size="19" fill="#14283e" text-anchor="middle"><text x="255" y="61">fork + exec → Worker</text><text x="255" y="161">READY / gaida komandu</text><text x="255" y="266">PROCESS</text><text x="255" y="293">RESULT vai ERROR</text><text x="255" y="396">SHUTDOWN → STOPPED</text><text x="255" y="423">IPC aizvēršana, exit(0)</text><text x="680" y="266">Negaidīta pabeigšana</text><text x="680" y="293">piem., SIGKILL</text><text x="680" y="396">IPC EOF</text><text x="680" y="423">Avārijas uzraudzība</text><text x="460" y="548">waitpid → statuss un beigu laiks</text><text x="460" y="573">Avārijā: nepabeigto darbu atdod rindai</text></g>
<g font-family="Arial,sans-serif" font-size="15" fill="#526277"><text x="270" y="215">piešķir failu</text><text x="48" y="219" transform="rotate(-90 48 219)">nākamais darbs</text><text x="270" y="345">normāla pabeigšana</text><text x="477" y="144">avārija / timeout</text></g></svg>
